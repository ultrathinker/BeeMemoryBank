version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
    ignore:
      # FluentAssertions 8 is not a technical upgrade but a licence change: from 8.0 the
      # library is commercial for anything that is not an open-source project, and the
      # assertion API this repo uses gained nothing worth paying for. Version 7 stays.
      # Remove this entry only together with a decision about that licence.
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]
      # Patch and minor updates are worth automating; major ones are API-breaking by definition
      # and every one of them needs its own change, its own test run and a human deciding it is
      # worth the churn (Test.Sdk 18, coverlet 10, xunit.runner 4, ModelContextProtocol 2,
      # System.CommandLine 2.0, ImageSharp 4, Markdig 1.x, SQLitePCLRaw 3 are all sitting there
      # for exactly that reason). Left on, they reopen weekly and nobody merges them, which is
      # how the previous backlog of stale pull requests happened. Run `dotnet list package
      # --outdated` when you want to see them.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
