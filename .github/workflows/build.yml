name: Build & Test

on:
  push:
    branches: [main, master, develop]
    paths-ignore: ['mobile/**', 'docs/**', '*.md']
  pull_request:
    branches: [main, master, develop]
    paths-ignore: ['mobile/**', 'docs/**', '*.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # VelopackIntegrationTests shells out to the vpk packaging CLI (not the Velopack
      # NuGet library referenced by the test project - that's the update-client API, this
      # is the separate global tool that builds release packages). Version pinned to match
      # the Velopack entry in Directory.Packages.props (versions moved there when the repo
      # switched to Central Package Management).
      - name: Install vpk (Velopack CLI)
        run: dotnet tool install --global vpk --version 1.2.0

      # Cache the ~113 MB quantized ONNX model so we do not re-download it on every push.
      - name: Cache ONNX model
        id: onnx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: libs/BeeMemoryBank.Core/Embeddings/Models/model.onnx
          key: onnx-multilingual-e5-small-v1

      # Tests boot the API via WebApplicationFactory; the API's DI graph
      # constructs OnnxEmbeddingGenerator at startup, which reads the model
      # file. The Api.csproj <Content> directive copies it into every bin/
      # folder when present.
      - name: Download ONNX model (cache miss only)
        if: steps.onnx-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p libs/BeeMemoryBank.Core/Embeddings/Models
          curl -L -o libs/BeeMemoryBank.Core/Embeddings/Models/model.onnx \
            https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/onnx/model_quantized.onnx

      # Build server-side projects only (libs, server, tools, tests).
      # The MAUI Android project under mobile/ requires the maui-android workload
      # (~1 GB download) and is built separately by build-mobile.yml on changes
      # under mobile/**.
      - name: Restore dependencies
        run: |
          set -e
          for proj in libs/*/*.csproj server/*/*.csproj tools/*/*.csproj tests/*/*.csproj; do
            dotnet restore "$proj"
          done

      - name: Build
        run: |
          set -e
          for proj in libs/*/*.csproj server/*/*.csproj tools/*/*.csproj tests/*/*.csproj; do
            dotnet build "$proj" --no-restore -c Release
          done

      - name: Test
        run: |
          set -e
          for proj in tests/*/*.csproj; do
            dotnet test "$proj" --no-build -c Release --verbosity normal
          done
