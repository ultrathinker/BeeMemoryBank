name: Build & Test

on:
  push:
    branches: [main, master, develop]
    paths-ignore: ['mobile/**', 'docs/**', '*.md']
  pull_request:
    branches: [main, master, develop]
    paths-ignore: ['mobile/**', 'docs/**', '*.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shards:
    name: Test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # VelopackIntegrationTests shells out to the vpk packaging CLI (not the Velopack
      # NuGet library referenced by the test project - that's the update-client API, this
      # is the separate global tool that builds release packages). Version pinned to match
      # the Velopack entry in Directory.Packages.props (versions moved there when the repo
      # switched to Central Package Management).
      - name: Install vpk (Velopack CLI)
        run: dotnet tool install --global vpk --version 1.2.0

      # Cache the ~113 MB quantized ONNX model so we do not re-download it on every push.
      # The cache key includes the on-disk path so an old entry (which stored the model under
      # the pre-split Core/Embeddings/Models location) cannot satisfy a hit here and silently
      # leave the new path empty.
      - name: Cache ONNX model
        id: onnx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: libs/BeeMemoryBank.Embeddings/Models/model.onnx
          key: onnx-multilingual-e5-small-761b726-embeddings-path

      # Tests boot the API via WebApplicationFactory; the API's DI graph
      # constructs OnnxEmbeddingGenerator at startup, which reads the model
      # file. The Api.csproj <Content> directive copies it into every bin/
      # folder when present.
      - name: Download ONNX model (cache miss only)
        if: steps.onnx-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p libs/BeeMemoryBank.Embeddings/Models
          curl -fL --retry 3 -o libs/BeeMemoryBank.Embeddings/Models/model.onnx \
            https://huggingface.co/Xenova/multilingual-e5-small/resolve/761b726dd34fb83930e26aab4e9ac3899aa1fa78/onnx/model_quantized.onnx

      # The model is a commit of the Hugging Face repository (not `main`) and its SHA-256 is checked on EVERY run, a cache hit
      # included: what the build embeds is exactly the file the Dockerfile and EmbeddingModelWiring.BundledModelSha256 name.
      # Core.Tests (DockerImageModelPinTests) keeps the three in step.
      - name: Verify the ONNX model
        run: echo "f80102d3f2a1229f387d3c81909990d8945513e347b0eab049f7de3c6f98c193  libs/BeeMemoryBank.Embeddings/Models/model.onnx" | sha256sum -c -

      # Build server-side projects only (libs, server, tools, tests).
      # The MAUI Android project under mobile/ requires the maui-android workload
      # (~1 GB download) and is built separately by build-mobile.yml on changes
      # under mobile/**.
      - name: Restore dependencies for this shard
        run: |
          set -e
          for proj in tests/BeeMemoryBank.Integration.Tests/BeeMemoryBank.Integration.Tests.csproj $(scripts/run-test-shard.sh projects "${{ matrix.shard }}"); do
            dotnet restore "$proj"
          done

      # ReleaseTool.Tests starts the published tool directly.  Restore every tool
      # here so this retains the previous workflow's compile contract.
      - name: Restore tools used by ReleaseTool tests
        if: matrix.shard == 3
        run: |
          set -e
          for proj in tools/*/*.csproj; do
            dotnet restore "$proj"
          done

      - name: Build this shard
        run: |
          set -e
          for proj in tests/BeeMemoryBank.Integration.Tests/BeeMemoryBank.Integration.Tests.csproj $(scripts/run-test-shard.sh projects "${{ matrix.shard }}"); do
            dotnet build "$proj" --no-restore -c Release -m:2 -nr:false
          done

      - name: Build tools used by ReleaseTool tests
        if: matrix.shard == 3
        run: |
          set -e
          for proj in tools/*/*.csproj; do
            dotnet build "$proj" --no-restore -c Release -m:2 -nr:false
          done

      # Proves the Integration filters cover the present non-Timing suite once each.
      # The Android boundary guard stays outside this workflow, as it requires Android builds.
      - name: Verify test-shard coverage
        if: matrix.shard == 0
        run: scripts/run-test-shard.sh coverage 0

      - name: Test this shard
        run: scripts/run-test-shard.sh run "${{ matrix.shard }}"

      # The proof that a blind node does not contain the vault, on what is actually shipped: the three blind programs are published the way
      # docker/blind/Dockerfile publishes them and every application assembly in the output is read at the metadata level.
      # BMB_REQUIRE_SCAN makes the scan fail instead of passing quietly if the variable is not set.
      - name: Publish the blind programs and scan them for vault code
        if: matrix.shard == 2
        run: |
          set -e
          out="$RUNNER_TEMP/blind-publish"
          for p in BlindNode BlindConsole BlindCli; do
            dotnet publish "server/BeeMemoryBank.$p/BeeMemoryBank.$p.csproj" -c Release -r linux-x64 --no-self-contained -p:UseAppHost=false -o "$out/$p"
          done
          BMB_REQUIRE_SCAN=1 BMB_SCAN_DIRS="$out/BlindNode;$out/BlindConsole;$out/BlindCli" \
            dotnet test tests/BeeMemoryBank.BlindNode.Tests/BeeMemoryBank.BlindNode.Tests.csproj --no-build -c Release --filter "FullyQualifiedName~PublishedFolders"

  # Preserve the historical required status-check name for branch protection.
  build:
    needs: test-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard
        run: |
          if [ "${{ needs.test-shards.result }}" != "success" ]; then
            echo "::error::test-shards result: ${{ needs.test-shards.result }}"
            exit 1
          fi
