name: Build Mobile (Android)

# Directory.Packages.props is in the path filters because every mobile package version lives
# there since the move to Central Package Management: a MAUI/AndroidX/Markdig bump no longer
# touches mobile/ at all, and Android CI must still run for it.
#
# libs/** is there because the app is mostly those libraries — it references Core, Storage, Sync,
# Search and Crypto, and gets its services from their DI extensions. Without this filter a change
# that alters what mobile resolves at startup ships with Android CI never having run: the DEK
# rotation applier that mobile now activates was added in exactly such a commit.
#
# tests/BeeMemoryBank.BlindMobile.Tests/** is there because the boundary guards that keep the blind app and the ordinary
# app apart live in that project and run only here: a commit that weakens them must start the workflow that runs them.
on:
  push:
    branches: [main, master, develop]
    paths: ['mobile/**', 'libs/**', 'tests/BeeMemoryBank.BlindMobile.Tests/**', 'Directory.Packages.props', '.github/workflows/build-mobile.yml']
  pull_request:
    branches: [main, master, develop]
    paths: ['mobile/**', 'libs/**', 'tests/BeeMemoryBank.BlindMobile.Tests/**', 'Directory.Packages.props', '.github/workflows/build-mobile.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Pin the SDK install location to a workspace-local dir. `dotnet workload install`
    # writes workloads into the ACTIVE SDK tree, so by forcing setup-dotnet to install
    # the SDK here we make the workload land in the SAME directory we cache below.
    # (The previous setup cached ~/.dotnet but the SDK lived in /usr/share/dotnet, so
    # the workload was never actually cached — on a cache hit the install step was
    # skipped yet the workload was absent → NETSDK1147.)
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Java JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: 'microsoft'
          java-version: '17'

      # The MAUI Android workload (~1 GB on disk) is the slowest single step.
      # Cache it across runs so we only pay for it on .NET SDK changes.
      # Key the workload cache on the EXACT resolved SDK version. The 10.0.x SDK floats, and a
      # workload installed for an older patch becomes incompatible after a float — `dotnet restore`
      # of the Android project then fails before the build even starts. Tying the cache to the SDK
      # version invalidates it on a float so the workload is reinstalled to match.
      - name: Cache .NET workloads
        id: workload-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.dotnet
          key: dotnet-workloads-maui-android-net10-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}

      - name: Install MAUI Android workload
        if: steps.workload-cache.outputs.cache-hit != 'true'
        run: dotnet workload install maui-android

      # The MAUI Android csproj declares <MauiAsset Include="Resources\Raw\model.onnx">
      # which fails the build if the file is absent. Cache + download mirroring
      # the server-side build.yml strategy.
      - name: Cache ONNX model
        id: onnx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: mobile/BeeMemoryBank.Mobile/Resources/Raw/model.onnx
          key: onnx-multilingual-e5-small-761b726-mobile

      - name: Download ONNX model (cache miss only)
        if: steps.onnx-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p mobile/BeeMemoryBank.Mobile/Resources/Raw
          curl -fL --retry 3 -o mobile/BeeMemoryBank.Mobile/Resources/Raw/model.onnx \
            https://huggingface.co/Xenova/multilingual-e5-small/resolve/761b726dd34fb83930e26aab4e9ac3899aa1fa78/onnx/model_quantized.onnx

      # The model is a commit of the Hugging Face repository (not `main`) and its SHA-256 is checked on EVERY run, a cache hit
      # included: what the build embeds is exactly the file the Dockerfile and EmbeddingModelWiring.BundledModelSha256 name.
      # Core.Tests (DockerImageModelPinTests) keeps the three in step.
      - name: Verify the ONNX model
        run: echo "f80102d3f2a1229f387d3c81909990d8945513e347b0eab049f7de3c6f98c193  mobile/BeeMemoryBank.Mobile/Resources/Raw/model.onnx" | sha256sum -c -

      - name: Restore mobile dependencies
        run: dotnet restore mobile/BeeMemoryBank.Mobile/BeeMemoryBank.Mobile.csproj

      - name: Build APK (Release, unsigned)
        run: |
          dotnet publish mobile/BeeMemoryBank.Mobile/BeeMemoryBank.Mobile.csproj \
            -f net10.0-android -c Release --no-restore

      # The blind node is its own app (build-blind below); its sources are still in mobile/BeeMemoryBank.Mobile
      # but the project leaves them out of the build. This reads the compiled assembly, the merged manifest and
      # the APK just built and fails if any blind-mode code is back in them.
      - name: Verify the ordinary app carries no blind-mode code
        run: |
          dotnet test tests/BeeMemoryBank.BlindMobile.Tests/BeeMemoryBank.BlindMobile.Tests.csproj \
            --filter "FullyQualifiedName~OrdinaryAppHasNoBlindCodeTests"

  build-blind:
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Java JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Cache .NET workloads
        id: workload-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.dotnet
          key: dotnet-workloads-maui-android-net10-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}

      - name: Install MAUI Android workload
        if: steps.workload-cache.outputs.cache-hit != 'true'
        run: dotnet workload install maui-android

      # Notice: NO ONNX model download needed for the blind node app.

      - name: Restore blind mobile dependencies
        run: dotnet restore mobile/BeeMemoryBank.BlindMobile/BeeMemoryBank.BlindMobile.csproj

      - name: Build Blind APK (Release, unsigned)
        run: |
          dotnet publish mobile/BeeMemoryBank.BlindMobile/BeeMemoryBank.BlindMobile.csproj \
            -f net10.0-android -c Release --no-restore

      # After the build: the boundary tests read the built BeeMemoryBank.BlindMobile.dll (every page,
      # platform class and service of the app), so the assembly has to exist when they run.
      # OrdinaryAppHasNoBlindCodeTests read the ORDINARY app's Release output, which this job never builds: they run in
      # the `build` job, after the ordinary APK exists (BuildMobileWorkflowTests keeps that split true).
      - name: Run unit & forbidden references tests
        run: |
          # BMB_SCAN_DIRS: the trimmed package (the linker output) is scanned for vault code as well as the build output;
          # BMB_REQUIRE_SCAN makes the scan fail instead of passing quietly if the folder is missing.
          BMB_REQUIRE_SCAN=1 BMB_SCAN_DIRS="$PWD/mobile/BeeMemoryBank.BlindMobile/obj/Release/net10.0-android/android-arm64/linked" \
          dotnet test tests/BeeMemoryBank.BlindMobile.Tests/BeeMemoryBank.BlindMobile.Tests.csproj \
            --filter "FullyQualifiedName!~OrdinaryAppHasNoBlindCodeTests"

      - name: Verify forbidden assets absent from Blind APK
        run: |
          APK_PATH=$(find mobile/BeeMemoryBank.BlindMobile/bin/Release/net10.0-android -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "APK not found!"; exit 1; fi
          echo "Found APK: $APK_PATH"
          if unzip -l "$APK_PATH" | grep -Ei "model\.onnx|Microsoft\.ML\.OnnxRuntime|Microsoft\.ML\.Tokenizers|BeeMemoryBank\.Embeddings|BeeMemoryBank\.Media|BeeMemoryBank\.Vault|SixLabors\.ImageSharp|SkiaSharp|Indiko\.Maui|Markdig"; then
            echo "ERROR: Forbidden asset found in Blind APK!"
            exit 1
          fi
          echo "Verification passed: No forbidden assets in Blind APK."

