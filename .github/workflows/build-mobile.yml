name: Build Mobile (Android)

# Directory.Packages.props is in the path filters because every mobile package version lives
# there since the move to Central Package Management: a MAUI/AndroidX/Markdig bump no longer
# touches mobile/ at all, and Android CI must still run for it.
on:
  push:
    branches: [main, master, develop]
    paths: ['mobile/**', 'Directory.Packages.props', '.github/workflows/build-mobile.yml']
  pull_request:
    branches: [main, master, develop]
    paths: ['mobile/**', 'Directory.Packages.props', '.github/workflows/build-mobile.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Pin the SDK install location to a workspace-local dir. `dotnet workload install`
    # writes workloads into the ACTIVE SDK tree, so by forcing setup-dotnet to install
    # the SDK here we make the workload land in the SAME directory we cache below.
    # (The previous setup cached ~/.dotnet but the SDK lived in /usr/share/dotnet, so
    # the workload was never actually cached — on a cache hit the install step was
    # skipped yet the workload was absent → NETSDK1147.)
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Java JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: 'microsoft'
          java-version: '17'

      # The MAUI Android workload (~1 GB on disk) is the slowest single step.
      # Cache it across runs so we only pay for it on .NET SDK changes.
      # Key the workload cache on the EXACT resolved SDK version. The 10.0.x SDK floats, and a
      # workload installed for an older patch becomes incompatible after a float — `dotnet restore`
      # of the Android project then fails before the build even starts. Tying the cache to the SDK
      # version invalidates it on a float so the workload is reinstalled to match.
      - name: Cache .NET workloads
        id: workload-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.dotnet
          key: dotnet-workloads-maui-android-net10-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}

      - name: Install MAUI Android workload
        if: steps.workload-cache.outputs.cache-hit != 'true'
        run: dotnet workload install maui-android

      # The MAUI Android csproj declares <MauiAsset Include="Resources\Raw\model.onnx">
      # which fails the build if the file is absent. Cache + download mirroring
      # the server-side build.yml strategy.
      - name: Cache ONNX model
        id: onnx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: mobile/BeeMemoryBank.Mobile/Resources/Raw/model.onnx
          key: onnx-multilingual-e5-small-v1

      - name: Download ONNX model (cache miss only)
        if: steps.onnx-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p mobile/BeeMemoryBank.Mobile/Resources/Raw
          curl -L -o mobile/BeeMemoryBank.Mobile/Resources/Raw/model.onnx \
            https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/onnx/model_quantized.onnx

      - name: Restore mobile dependencies
        run: dotnet restore mobile/BeeMemoryBank.Mobile/BeeMemoryBank.Mobile.csproj

      - name: Build APK (Release, unsigned)
        run: |
          dotnet publish mobile/BeeMemoryBank.Mobile/BeeMemoryBank.Mobile.csproj \
            -f net10.0-android -c Release --no-restore
