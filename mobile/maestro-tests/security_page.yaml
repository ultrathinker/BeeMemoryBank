appId: com.beememorybank.mobile
---
# The Settings tab: its first card is sign-in (the password slots are a Debug build only now).
- runFlow: _go_home.yaml
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 3000
- tapOn:
    point: "87%,95%"
- extendedWaitUntil:
    visible:
      text: "Sign-in"
    timeout: 10000
- assertVisible:
    text: "Sign-in"
- takeScreenshot: security_page
