appId: com.beememorybank.mobile
---
- runFlow: _go_home.yaml
- extendedWaitUntil:
    visible:
      text: "Search"
    timeout: 3000
- tapOn:
    point: "37%,95%"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/ArticlesList"
    timeout: 10000
# The "also search in text" switch is on by default (the mock-up), no tap needed.
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/SearchBar"
    timeout: 3000
- tapOn:
    id: "com.beememorybank.mobile:id/SearchBar"
- inputText: "red pill"
- extendedWaitUntil:
    visible:
      text: "The Matrix"
    timeout: 30000
- takeScreenshot: content_search
