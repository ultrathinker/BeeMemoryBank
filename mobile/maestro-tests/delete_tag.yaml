appId: com.beememorybank.mobile
---
- runFlow: _go_home.yaml
- extendedWaitUntil:
    visible:
      text: "Search"
    timeout: 3000
- tapOn:
    point: "37%,95%"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/ArticlesList"
    timeout: 10000
- tapOn:
    text: "New article"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/TitleEntry"
    timeout: 10000
- tapOn:
    id: "com.beememorybank.mobile:id/TitleEntry"
- inputText: "Temp Tag Delete Test"
- pressKey: back
- tapOn:
    id: "com.beememorybank.mobile:id/ConceptTagsEntry"
- inputText: "maestro-temp-tag"
- pressKey: back
- tapOn:
    id: "com.beememorybank.mobile:id/AddTagButton"
- tapOn:
    text: "SaveToolbarButton"
- extendedWaitUntil:
    visible:
      text: "Temp Tag Delete Test"
    timeout: 30000
- takeScreenshot: temp_article
- runFlow: _go_home.yaml
- extendedWaitUntil:
    visible:
      text: "Search"
    timeout: 3000
- tapOn:
    point: "37%,95%"
- extendedWaitUntil:
    visible:
      text: "Tags"
    timeout: 10000
- tapOn:
    text: "Tags"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/TagsList"
    timeout: 10000
- tapOn:
    id: "com.beememorybank.mobile:id/TagsSearchBar"
- inputText: "maestro-temp-tag"
- extendedWaitUntil:
    visible:
      text: "maestro-temp-tag"
    timeout: 3000
- tapOn:
    text: "⋮"
- extendedWaitUntil:
    visible:
      text: "Delete"
    timeout: 3000
- tapOn:
    text: "Delete"
- extendedWaitUntil:
    visible:
      text: "Delete tag"
    timeout: 3000
- tapOn:
    text: "Delete"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/TagsList"
    timeout: 30000
- takeScreenshot: tag_deleted
