appId: com.beememorybank.mobile
---
- runFlow: _go_home.yaml
- extendedWaitUntil:
    visible:
      text: "Sync"
    timeout: 3000
- tapOn:
    point: "62%,95%"
# Scroll to top first in case page was left scrolled
- swipe:
    direction: DOWN
    duration: 500
- swipe:
    direction: DOWN
    duration: 500
- swipe:
    direction: DOWN
    duration: 500
- extendedWaitUntil:
    visible:
      text: "State"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "com.beememorybank.mobile:id/SyncNowButton"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "com.beememorybank.mobile:id/SyncNowButton"
- scrollUntilVisible:
    element:
      text: "State"
    direction: UP
    timeout: 10000
- takeScreenshot: sync_now_done
