appId: com.beememorybank.mobile
---
- runFlow: _go_home.yaml
- extendedWaitUntil:
    visible:
      text: "Search"
    timeout: 30000
- tapOn:
    point: "37%,95%"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/ArticlesList"
    timeout: 30000
- tapOn:
    text: "New article"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/TitleEntry"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "com.beememorybank.mobile:id/ChooseFolderButton"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "com.beememorybank.mobile:id/ChooseFolderButton"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/FolderPickerList"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Technology"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Technology"
- extendedWaitUntil:
    visible:
      text: "Select"
    timeout: 30000
- tapOn:
    text: "Select"
- extendedWaitUntil:
    visible:
      text: "/Technology"
    timeout: 30000
- takeScreenshot: folder_picker
- back
