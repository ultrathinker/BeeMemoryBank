appId: com.beememorybank.mobile
---
# Lock now lives in Settings (the old flyout's Lock button moved there with the four-tab shell).
- runFlow: _go_home.yaml
- extendedWaitUntil:
    visible:
      text: "Sync"
    timeout: 3000
- tapOn:
    point: "62%,95%"
- extendedWaitUntil:
    visible:
      text: "State"
    timeout: 10000
- tapOn:
    point: "87%,95%"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/LockNowButton"
    timeout: 10000
- tapOn:
    id: "com.beememorybank.mobile:id/LockNowButton"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/UnlockButton"
    timeout: 10000
- tapOn:
    id: "com.beememorybank.mobile:id/PasswordEntry"
- inputText: ${BMB_TEST_PASSWORD}
- pressKey: back
- tapOn:
    id: "com.beememorybank.mobile:id/UnlockButton"
- extendedWaitUntil:
    visible:
      text: "State"
    timeout: 30000
- takeScreenshot: lock_reunlock
