appId: com.beememorybank.mobile
---
# === GO HOME: get to a root tab page ===
#
# 1. launchApp — if app exited or is in background, brings it back
# 2. If on Unlock screen — enter password
# 3. If on a pushed page ("Navigate up" visible) — press back (up to 6 times)
#
# After this flow the four-tab bar is visible (Tree / Search / Sync / Settings).
# There is no navigation drawer any more: each test taps its tab directly.
# Tab taps are by point (12% / 37% / 62% / 87% of the width, near the bottom):
# the header title shows the same word as the tab label, so a text tap would
# land on the header instead of the tab.

# Restart app to get clean navigation state
- launchApp:
    appId: "com.beememorybank.mobile"
    stopApp: true
    clearKeychain: false
    clearState: false

# Dismiss Android permission dialogs if present
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn:
          text: "Allow"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn:
          text: "Allow"

# Handle Unlock screen
- runFlow:
    when:
      visible:
        id: "com.beememorybank.mobile:id/UnlockButton"
    commands:
      - tapOn:
          id: "com.beememorybank.mobile:id/PasswordEntry"
      - inputText: ${BMB_TEST_PASSWORD}
      - pressKey: back
      - tapOn:
          id: "com.beememorybank.mobile:id/UnlockButton"
      - extendedWaitUntil:
          visible:
            text: "State"
          timeout: 30000

# Pop pushed pages: press back while "Navigate up" is visible
- runFlow:
    when:
      visible: "Navigate up"
    commands:
      - back

- runFlow:
    when:
      visible: "Navigate up"
    commands:
      - back

- runFlow:
    when:
      visible: "Navigate up"
    commands:
      - back

- runFlow:
    when:
      visible: "Navigate up"
    commands:
      - back

- runFlow:
    when:
      visible: "Navigate up"
    commands:
      - back

- runFlow:
    when:
      visible: "Navigate up"
    commands:
      - back
