appId: com.beememorybank.mobile
---
- runFlow: _go_home.yaml
- extendedWaitUntil:
    visible:
      text: "Tree"
    timeout: 30000
- tapOn:
    point: "12%,95%"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/TreeList"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Movies"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Movies"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/FolderList"
    timeout: 30000
- tapOn:
    text: "The Matrix"
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/TitleLabel"
    timeout: 30000
- assertVisible:
    text: "The Matrix"
- takeScreenshot: before_refresh
- swipe:
    direction: DOWN
    duration: 1000
- extendedWaitUntil:
    visible:
      id: "com.beememorybank.mobile:id/TitleLabel"
    timeout: 30000
- assertVisible:
    text: "The Matrix"
- takeScreenshot: after_refresh
