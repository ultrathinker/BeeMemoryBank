# Reference deployment for a node that must be reachable from other nodes / MCP agents.
#
# It builds from this source tree. To run the ready-made image instead, replace the `build:` block below with
#   image: ghcr.io/ultrathinker/beememorybank:${BMB_VERSION:-latest}
# (see docker-compose.image.yml); everything else stays as it is.
#
# Use this when a reverse proxy (Apache/Nginx/Caddy) terminates TLS in front of the node. The
# default docker-compose.yml publishes only the Web port and is the right choice for a purely
# local node; this file is its counterpart for a published one.
#
# THE ONE RULE: the API port is published on the HOST'S LOOPBACK ONLY, never 0.0.0.0.
#
# The API surface is not safe to expose directly. Several routes deliberately skip the
# X-Internal-Key check because they must work before a session exists:
#   POST /api/session/unlock  — answers 401 on a wrong master password, i.e. it PROCESSES the
#                               attempt. Publicly reachable, that is a master-password oracle, and
#                               a correct guess unlocks the vault globally for every user and agent
#                               on the node, not just for the caller.
#   GET  /api/session/status  — answers 200 and leaks whether the vault is unlocked.
#   POST /api/join            — master password grants mesh membership.
# The reverse proxy is what keeps those private: it forwards only the routes that are meant to be
# public and nothing else. Publishing the port on 0.0.0.0 bypasses that filter entirely — and
# Docker's port publishing writes DNAT rules directly, so it is reachable from the internet even on
# a host you believe ufw is protecting. This was a real, live exposure once; don't recreate it.
#
# Both loopback families are listed because a proxy resolving "localhost" gets ::1 first on most
# modern distributions, and an IPv4-only mapping would leave it connecting to a closed port.
#
# Do NOT "harden" this further by binding the API process to 127.0.0.1 inside the container (via
# ASPNETCORE_URLS in docker-entrypoint.sh): Docker's published-port DNAT arrives on the container's
# bridge interface, not its loopback, so a loopback bind there silently breaks these mappings and
# takes every proxied route down with them.
#
# Proxy configuration: forward ONLY these paths to the API port, everything else to the Web port.
#   /mcp                          -> API  (MCP for AI agents; Bearer-token auth at the application level)
#   /api/sync                     -> API  (node-to-node synchronization, Ed25519-authenticated)
#   /api/join                     -> API  (join protocol)
#   /api/join/abort               -> API  (a joiner whose join failed takes back its row)
#   /api/snapshots/restore/*/file -> API  (network-wide restore; sync-token authenticated)
#   /api/blind/replica            -> API  (blind copies can call this node — see below)
#   /                             -> Web
#
# OPTIONAL, off unless you add it to the proxy: guest accounts for other people. Three more routes,
# forwarded to the API in exactly the same way:
#   /api/auth/remote-token        -> API  (a user name and password for a token; the node rate-limits it)
#   /api/folders/accessible       -> API  (the folders a guest may mirror; needs that token)
#   /api/folders/by-path/snapshot -> API  (one folder and its articles; needs that token)
# Without them, another node's remote account for this node fails with "The other node does not let
# guest sign-ins through". Ready-to-paste blocks for Caddy, nginx, Apache and Cloudflare Tunnel, and
# what it means for security: docs/internet-access.md ("Optional: guest accounts for other people").
#
# See docs/deployment.md ("Reverse Proxy — What Is Exposed") for the full rationale.
#
# Blind copies can call this node. A blind copy (the Windows, macOS or Android blind app) never listens: it
# calls a node. To let it call this one, forward the two routes it uses — /api/sync/* (already above) and
# /api/blind/replica (the signed package of its first load) — and mark the node under Admin > Trusted Nodes
# (on another node of the network): "Let blind copies call this node". Both routes need a sync token
# (a device you paired signs in with its own key); what they return is ciphertext plus the plaintext metadata
# every node holds (titles, folder paths, tags — ADR 0005), never the master key. A lost blind copy is
# revoked in Admin, and its token stops working at once. See docs/internet-access.md.
#
# The proxy must also pass X-Forwarded-For (mod_proxy and nginx do by default) and the node must be
# told to believe it — see BMB_TRUSTED_PROXIES below.

services:
  bmb:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Web — reached by the reverse proxy, not by browsers directly.
      - "127.0.0.1:${BMB_WEB_PORT:-5301}:5301"
      - "::1:${BMB_WEB_PORT:-5301}:5301"
      # API — loopback only. See the warning above before changing this.
      - "127.0.0.1:${BMB_API_PORT:-5300}:5300"
      - "::1:${BMB_API_PORT:-5300}:5300"
    volumes:
      - ${BMB_DATA_PATH:-./data}:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - BMB_DATA_PATH=/app/data
      # No BMB_ONNX_MODEL_PATH: the search model is inside the image. A model.onnx in the data folder is still used first.
      # Whose X-Forwarded-For to believe. REQUIRED for any proxied deployment: Docker's published
      # port DNATs through the bridge, so without this every external client appears to the node as
      # the bridge gateway (172.x.0.1) and they all share ONE rate-limit bucket — meaning a single
      # anonymous caller can exhaust the /api/sync/challenge budget and stall synchronization for
      # every peer, or the login budget for every user. Covers the default Docker bridge ranges;
      # narrow it to this stack's own network if you know its subnet.
      - BMB_TRUSTED_PROXIES=172.16.0.0/12
      # The host port the API is published on above. The Profile page prints the snippet for an AI
      # assistant from it (http://127.0.0.1:<port>/mcp, right for assistants on this computer) when
      # the page is not opened through your proxy. Opened through the proxy it prints that address
      # plus /mcp instead, which works because the proxy forwards /mcp (see above). To print one
      # fixed address whatever the page is opened from, set BMB_MCP_URL in .env (for example
      # BMB_MCP_URL=https://bee.example.com/mcp). Empty = not set.
      - BMB_API_PUBLISHED_PORT=${BMB_API_PORT:-5300}
      - BMB_MCP_URL=${BMB_MCP_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5300/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
